<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quantum Entanglement Windows</title>
  <link rel="icon" href="data:," />
  <style>
:root {
  --bg: #05060d;
  --fg: #e8ecff;
  --muted: #8a93b8;
  --accent: #7c9cff;
  --panel: rgba(16, 20, 40, 0.72);
  --border: rgba(124, 156, 255, 0.25);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6ff;
    --fg: #14182b;
    --muted: #55608a;
    --panel: rgba(255, 255, 255, 0.8);
  }
}

:root[data-theme="dark"] {
  --bg: #05060d;
  --fg: #e8ecff;
  --muted: #8a93b8;
  --panel: rgba(16, 20, 40, 0.72);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#hud {
  position: fixed;
  left: 16px;
  bottom: 16px;
  max-width: min(360px, calc(100vw - 32px));
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

#hud h1 {
  margin: 0 0 6px;
  font-size: 1.05rem;
  font-weight: 600;
}

#hud p {
  margin: 0 0 12px;
  font-size: 0.875rem;
  line-height: 1.45;
  color: var(--muted);
}

#hud .hint {
  margin: 10px 0 0;
  font-size: 0.75rem;
}

#hud code {
  font-family: ui-monospace, Consolas, monospace;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  font: inherit;
  font-size: 0.875rem;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #05060d;
  cursor: pointer;
}

button.ghost {
  background: transparent;
  color: var(--accent);
}

button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 480px) {
  #hud {
    left: 8px;
    right: 8px;
    bottom: 8px;
    max-width: none;
  }
}
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="hud">
    <h1>Quantum entanglement</h1>
    <p>Each window holds its own sphere. Move your mouse to disturb them, then spawn more windows and drag them close: nearby spheres pull on each other and absorb each other, stronger the closer they get.</p>
    <div class="row">
      <button id="spawn">Spawn window</button>
      <button id="closeAll" class="ghost">Close all</button>
    </div>
    <p class="hint">Use a local server (e.g. <code>npx serve .</code>), not file://.</p>
  </div>

  <script>
// Quantum entanglement effect across browser windows.
//
// Each window owns one sphere, centred on its own viewport. Every window
// broadcasts its sphere's dot positions (in screen coordinates) over a
// BroadcastChannel, and draws the spheres it receives from the other windows,
// so a sphere that crosses into another window's viewport is seen there too.
//
// Spheres pull on each other. The closer two sphere centres are, the stronger
// the pull: dots drift toward the other sphere, and the ones that reach its core
// fade out, as if absorbed. Each window only simulates its own sphere; the
// others arrive as broadcast positions.

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const spawnBtn = document.getElementById('spawn');
const closeAllBtn = document.getElementById('closeAll');

const isMain = !window.opener;
const channel = new BroadcastChannel('quantum-entanglement');
const WINDOW_ID = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

// Each sphere spins from its own starting angle, so spheres don't look identical.
const PHASE = [...WINDOW_ID].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % 1000 / 1000 * Math.PI * 2;

// Stable pseudo-random value in [0, 1) from the window id and a salt.
function hashUnit(str, salt) {
  let h = 0;
  for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) % 100000;
  const x = Math.sin(h * 12.9898 + salt * 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// Stable pseudo-random value in [0, 1) from an integer index.
function unitRand(i) {
  const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// Each window gets its own base colour, picked from this palette.
const HUE_PALETTE = [130, 0, 195, 300, 35];
const SPHERE_HUE = HUE_PALETTE[Math.floor(hashUnit(WINDOW_ID, 1) * HUE_PALETTE.length)];

// Each sphere gets its own lumpy, stretched form, so no two spheres match.
const SHAPE = {
  a: hashUnit(WINDOW_ID, 2) * Math.PI * 2,
  b: hashUnit(WINDOW_ID, 3) * Math.PI * 2,
  c: hashUnit(WINDOW_ID, 4) * Math.PI * 2,
  sx: 0.75 + hashUnit(WINDOW_ID, 5) * 0.5,
  sy: 0.75 + hashUnit(WINDOW_ID, 6) * 0.5,
  sz: 0.75 + hashUnit(WINDOW_ID, 7) * 0.5,
};

const DOT_COUNT = 900;
const SPHERE_FRACTION = 0.4; // sphere radius as a share of the window's smaller side
const SPIN_SPEED = 0.35; // rad/s around Y
const TILT = 0.4; // rad around X
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

const PULL_REACH = 2.6; // spheres start pulling when centres are within (r1 + r2) * PULL_REACH
const PULL_MAX = 0.8; // fraction of the way a dot moves toward another sphere at full strength
const OFFSET_EASE = 0.12; // how quickly a dot's offset follows its target each frame
const ABSORB_CORE = 0.6; // dots inside this share of the other sphere's radius fade out

const ATTRACT_RADIUS = 60; // screen px: dots of one sphere closer than this attract each other
const ATTRACT_STRENGTH = 12; // max displacement per attracting pair, screen px

const INFLUENCE_RADIUS = 220; // screen px around the shared pointer
const PUSH_STRENGTH = 90;

const STALE_MS = 400; // forget a window's sphere if it has not been heard from

// Fibonacci sphere: evenly spaced unit vectors, computed once.
const dots = Array.from({ length: DOT_COUNT }, (_, i) => {
  const y = 1 - (2 * (i + 0.5)) / DOT_COUNT;
  const r = Math.sqrt(1 - y * y);
  const theta = GOLDEN_ANGLE * i;
  return { x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, hue: (i / DOT_COUNT) * 360 };
});

// Per-dot offset from its base position, carried over between frames.
const offsets = dots.map(() => ({ x: 0, y: 0 }));

// Origin of this window's content area in screen coordinates.
const origin = { x: 0, y: 0 };
function updateOrigin() {
  origin.x = window.screenX + (window.outerWidth - window.innerWidth) / 2;
  origin.y = window.screenY + (window.outerHeight - window.innerHeight);
}

// Spheres from other windows: id -> { seen, cx, cy, r, dots }.
const remote = new Map();

// Shared pointer in screen coordinates. null when no window has the pointer.
let pointer = null;

channel.onmessage = (event) => {
  const msg = event.data;
  if (msg.type === 'pointer') pointer = msg.point;
  if (msg.type === 'sphere') {
    remote.set(msg.id, { seen: performance.now(), cx: msg.cx, cy: msg.cy, r: msg.r, dots: msg.dots });
  }
  if (msg.type === 'bye') remote.delete(msg.id);
  if (msg.type === 'close' && !isMain) window.close();
};

window.addEventListener('pagehide', () => channel.postMessage({ type: 'bye', id: WINDOW_ID }));

function broadcastPointer(point) {
  pointer = point;
  channel.postMessage({ type: 'pointer', point });
}

window.addEventListener('pointermove', (e) => {
  updateOrigin();
  broadcastPointer({ x: origin.x + e.clientX, y: origin.y + e.clientY });
});
window.addEventListener('pointerleave', () => broadcastPointer(null));
window.addEventListener('blur', () => broadcastPointer(null));

// Keep the canvas sized to the viewport and crisp on high-DPI screens.
let width = 0;
let height = 0;
function resize() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Push a unit-sphere point out or in by slow, per-sphere noise, then stretch it
// into this sphere's own ellipsoid. The result is an irregular, moving form.
function deform(d, t) {
  const n =
    0.14 * Math.sin(d.x * 2.3 + SHAPE.a + t * 0.4) * Math.cos(d.y * 1.9 + SHAPE.b - t * 0.3) +
    0.1 * Math.sin(d.z * 3.7 + d.x * 1.3 + SHAPE.c + t * 0.5);
  const k = 1 + n;
  return { x: d.x * k * SHAPE.sx, y: d.y * k * SHAPE.sy, z: d.z * k * SHAPE.sz };
}

// Rotate a point around Y, then X, then project it. Returns offset from the centre and depth.
function project(p, t, radius) {
  const ay = t * SPIN_SPEED + PHASE;
  const cy = Math.cos(ay);
  const sy = Math.sin(ay);
  const x1 = p.x * cy + p.z * sy;
  const z1 = -p.x * sy + p.z * cy;

  const cx = Math.cos(TILT);
  const sx = Math.sin(TILT);
  const y2 = p.y * cx - z1 * sx;
  const z2 = p.y * sx + z1 * cx;

  // Perspective: nearer points (z2 > 0) are larger.
  const perspective = 2.2 / (2.2 - z2);
  return {
    x: x1 * radius * perspective,
    y: y2 * radius * perspective,
    depth: (z2 + 1) / 2, // 0 (far) .. 1 (near)
    scale: perspective,
  };
}

// Round to one decimal place to keep broadcast messages small.
const r1 = (v) => Math.round(v * 10) / 10;

function frame() {
  const t = Date.now() / 1000;
  updateOrigin();

  const now = performance.now();
  for (const [id, s] of remote) {
    if (now - s.seen > STALE_MS) remote.delete(id);
  }

  // This window's sphere, centred on its own viewport.
  const cx = origin.x + width / 2;
  const cy = origin.y + height / 2;
  const R = Math.min(width, height) * SPHERE_FRACTION;

  ctx.clearRect(0, 0, width, height);

  // 1. Base positions of this sphere.
  const pts = dots.map((dot, i) => {
    const p = project(deform(dot, t), t, R);
    return {
      index: i,
      bx: cx + p.x,
      by: cy + p.y,
      depth: p.depth,
      scale: p.scale,
      // Colour stays near the sphere's base hue, with a slight shimmer per dot.
      hue: SPHERE_HUE + (dot.hue - 180) * 0.12 + Math.sin(t + dot.hue) * 6,
      alpha: 1,
    };
  });

  // 2. Pull toward nearby spheres. Strength rises as centres get closer.
  //    Each dot's offset eases toward its target, so the pull builds up and fades.
  const pulls = [...remote.values()]
    .map((o) => {
      const D = Math.hypot(o.cx - cx, o.cy - cy);
      const reach = (R + o.r) * PULL_REACH;
      const s = Math.max(0, 1 - D / reach);
      return { o, s: s * s };
    })
    .filter((p) => p.s > 0);
  const totalS = pulls.reduce((sum, p) => sum + p.s, 0);

  for (const pt of pts) {
    const off = offsets[pt.index];

    // Strength-weighted average direction toward the other spheres.
    let tx = 0;
    let ty = 0;
    for (const { o, s } of pulls) {
      tx += (o.cx - pt.bx) * s;
      ty += (o.cy - pt.by) * s;

      // Absorption: a dot that reaches the other sphere's core fades out.
      const dist = Math.hypot(pt.bx + off.x - o.cx, pt.by + off.y - o.cy);
      const core = o.r * ABSORB_CORE;
      if (dist < core) pt.alpha = Math.min(pt.alpha, dist / core);
    }
    if (totalS > 0) {
      const norm = PULL_MAX / Math.max(1, totalS);
      tx *= norm;
      ty *= norm;
    } else {
      tx = 0;
      ty = 0;
    }

    off.x += (tx - off.x) * OFFSET_EASE;
    off.y += (ty - off.y) * OFFSET_EASE;
    pt.gx = pt.bx + off.x;
    pt.gy = pt.by + off.y;
  }

  // 3. Attraction between close dots of this sphere. Computed from the current
  //    positions, so the result doesn't depend on loop order.
  const pull = pts.map(() => ({ x: 0, y: 0 }));
  // Only compare each dot with its next few neighbours in the spiral. Neighbours
  // on the sphere are close in this ordering, and it keeps the cost linear.
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < Math.min(pts.length, i + 9); j++) {
      const dx = pts[j].gx - pts[i].gx;
      const dy = pts[j].gy - pts[i].gy;
      const d = Math.hypot(dx, dy);
      if (d >= ATTRACT_RADIUS || d < 0.5) continue;

      const k = 1 - d / ATTRACT_RADIUS;
      const f = k * k * ATTRACT_STRENGTH;
      const ux = dx / d;
      const uy = dy / d;
      pull[i].x += ux * f;
      pull[i].y += uy * f;
      pull[j].x -= ux * f;
      pull[j].y -= uy * f;
    }
  }

  // 4. Apply dot attraction and the shared-pointer push.
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    p.gx += pull[i].x;
    p.gy += pull[i].y;

    if (pointer) {
      const dx = pointer.x - p.gx;
      const dy = pointer.y - p.gy;
      const d = Math.hypot(dx, dy);
      if (d < INFLUENCE_RADIUS && d > 0.001) {
        const k = 1 - d / INFLUENCE_RADIUS;
        const push = k * k * PUSH_STRENGTH;
        p.gx += (dx / d) * push;
        p.gy += (dy / d) * push;
      }
    }
  }

  // Halo: a loose cloud of dust just outside each sphere's surface. It follows
  // the core, so it moves and fuses with it.
  const halo = pts
    .filter((p) => p.index % 3 === 0)
    .map((p) => {
      const h = 1.12 + 0.35 * unitRand(p.index) + 0.04 * Math.sin(t * 0.7 + p.index);
      return {
        ...p,
        gx: p.gx + (p.bx - cx) * (h - 1),
        gy: p.gy + (p.by - cy) * (h - 1),
        alpha: 0.2,
      };
    });

  // 5. Broadcast this sphere so other windows can draw it and be pulled by it.
  channel.postMessage({
    type: 'sphere',
    id: WINDOW_ID,
    cx: r1(cx),
    cy: r1(cy),
    r: r1(R),
    dots: [...pts, ...halo].map((p) => [r1(p.gx), r1(p.gy), r1(p.depth), r1(p.scale), r1(p.hue), r1(p.alpha)]),
  });

  // 6. Collect everything drawable in this window's local coordinates.
  //    Each entry carries its screen position; the window is only a viewport.
  const items = [...pts, ...halo].map((p) => ({
    x: p.gx - origin.x,
    y: p.gy - origin.y,
    depth: p.depth,
    scale: p.scale,
    hue: p.hue,
    alpha: p.alpha,
  }));
  for (const o of remote.values()) {
    for (const [gx, gy, depth, scale, hue, alpha] of o.dots) {
      items.push({ x: gx - origin.x, y: gy - origin.y, depth, scale, hue, alpha });
    }
  }

  // 7a. Bridge: while two spheres are close, a stream of dust is drawn from this
  //     sphere's centre to the other one, thickening as they get closer.
  // Stream: dust is pulled off this sphere and spirals toward the other one, like
  // matter falling into a black hole. Denser and wider as the spheres get closer.
  ctx.globalCompositeOperation = 'lighter';
  for (const { o, s } of pulls) {
    const count = Math.round(900 * s);
    const len = Math.hypot(o.cx - cx, o.cy - cy);
    const ux = (o.cx - cx) / len;
    const uy = (o.cy - cy) / len;
    for (let k = 0; k < count; k++) {
      const along = (unitRand(k) + t * (0.12 + 0.1 * unitRand(k + 500))) % 1;
      const spin = along * Math.PI * 4 + t * 2 + k;
      const across = Math.sin(spin) * (0.25 + 0.75 * unitRand(k + 900));
      const halfWidth = R * 0.2 * s * (1 - 0.5 * along);
      const px = cx + ux * len * along - uy * across * halfWidth;
      const py = cy + uy * len * along + ux * across * halfWidth;
      const x = px - origin.x;
      const y = py - origin.y;
      if (x < -20 || y < -20 || x > width + 20 || y > height + 20) continue;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${SPHERE_HUE}, 100%, 70%, ${0.3 + 0.6 * s})`;
      ctx.arc(x, y, 0.8 + 1.2 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 8. Dots, far first so near dots overlap them. Skip dots outside this window.
  items.sort((a, b) => a.depth - b.depth);
  for (const d of items) {
    if (d.alpha <= 0.01) continue;
    if (d.x < -20 || d.y < -20 || d.x > width + 20 || d.y > height + 20) continue;

    const radius = 0.7 + 1.4 * d.depth * d.scale;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${d.hue}, 100%, ${50 + 30 * d.depth}%, ${(0.2 + 0.8 * d.depth) * d.alpha})`;
    ctx.arc(d.x, d.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

// HUD and window spawning live only in the window the user opened first.
if (isMain) {
  const openWindows = [];
  let spawnCount = 0;

  spawnBtn.addEventListener('click', () => {
    const offset = (spawnCount++ % 8) * 40;
    const w = 360;
    const h = 260;
    const features = `popup=yes,width=${w},height=${h},left=${200 + offset},top=${160 + offset}`;
    const win = window.open(window.location.href, `entangle-${Date.now()}`, features);
    if (win) openWindows.push(win);
  });

  closeAllBtn.addEventListener('click', () => {
    channel.postMessage({ type: 'close' });
    openWindows.length = 0;
  });
} else {
  hud.hidden = true;
}

requestAnimationFrame(frame);
</script>
</body>
</html>
