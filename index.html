<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jswale — Outils</title>
<meta name="description" content="Mes outils et petits projets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080d; --text: #eef0f6; --muted: #8d94a8;
    --glass: rgba(255,255,255,.045); --border: rgba(255,255,255,.09);
    --a1: #7c5cff; --a2: #22d3ee; --a3: #ff5ca8;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font: 16px/1.55 Inter, system-ui, sans-serif; overflow-x: hidden; }

  /* Aurora background */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .aurora i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%;
    filter: blur(90px); opacity: .35; animation: float 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { background: var(--a1); top: -20%; left: -10%; }
  .aurora i:nth-child(2) { background: var(--a2); bottom: -25%; right: -10%; animation-delay: -7s; opacity: .22; }
  .aurora i:nth-child(3) { background: var(--a3); top: 30%; left: 40%; width: 35vmax; height: 35vmax; animation-delay: -13s; opacity: .15; }
  .aurora::after { content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
  @keyframes float { to { transform: translate(8vw, 6vh) scale(1.15); } }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 72px; }

  header { padding: clamp(64px, 14vh, 140px) 0 40px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(12px);
    font: 500 .78rem "JetBrains Mono", monospace; color: var(--muted); }
  .badge b { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; }
  h1 { margin: 22px 0 16px; font-size: clamp(2.6rem, 9vw, 5.5rem); line-height: 1; font-weight: 800; letter-spacing: -.04em; }
  h1 span { background: linear-gradient(110deg, var(--a2), var(--a1) 45%, var(--a3));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 8s linear infinite; }
  @keyframes shine { to { background-position: 200% center; } }
  header p { margin: 0; color: var(--muted); font-size: 1.15rem; max-width: 52ch; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0 28px; }
  .search { position: relative; flex: 1 1 260px; }
  .search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; opacity: .5; }
  input[type=search] { width: 100%; padding: 12px 16px 12px 42px; border-radius: 14px; outline: none;
    border: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(12px);
    color: var(--text); font: inherit; transition: border-color .2s, box-shadow .2s; }
  input[type=search]:focus { border-color: var(--a1); box-shadow: 0 0 0 4px rgba(124,92,255,.18); }
  .chip { padding: 10px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--glass);
    color: var(--muted); font: 500 .88rem Inter, sans-serif; cursor: pointer; backdrop-filter: blur(12px);
    transition: all .2s; }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed=true] { color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 6px 24px -6px var(--a1); }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

  /* Cards with cursor spotlight + gradient border */
  .card { --mx: 50%; --my: 50%; position: relative; display: flex; flex-direction: column; gap: 12px;
    padding: 26px; border-radius: 22px; color: inherit; text-decoration: none; isolation: isolate;
    background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(16px);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s;
    animation: rise .6s both; animation-delay: calc(var(--i) * 60ms); }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; opacity: 0;
    background: radial-gradient(420px circle at var(--mx) var(--my), rgba(124,92,255,.22), transparent 55%);
    transition: opacity .3s; }
  .card::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; z-index: -1; padding: 1px; opacity: 0;
    background: radial-gradient(260px circle at var(--mx) var(--my), var(--a2), var(--a1) 40%, transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; transition: opacity .3s; }
  .card:hover, .card:focus-visible { transform: translateY(-6px); outline: none; }
  .card:hover::before, .card:hover::after, .card:focus-visible::before, .card:focus-visible::after { opacity: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .icon { width: 54px; height: 54px; display: grid; place-items: center; font-size: 1.7rem; border-radius: 16px;
    background: linear-gradient(135deg, rgba(124,92,255,.25), rgba(34,211,238,.15)); border: 1px solid var(--border); }
  .cat { font: 500 .7rem "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .card h2 { margin: 6px 0 0; font-size: 1.25rem; letter-spacing: -.02em; }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 500 .72rem "JetBrains Mono", monospace; padding: 3px 10px; border-radius: 8px;
    background: rgba(255,255,255,.06); color: #c3c9da; }
  .go { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; color: var(--a2); }
  .go svg { transition: transform .25s; }
  .card.private { cursor: default; }
  .card.private:hover { transform: none; }
  .lock { font-weight: 600; font-size: .9rem; color: var(--muted); }
  .card:hover .go svg { transform: translate(4px, -4px); }

  .empty { color: var(--muted); text-align: center; padding: 60px 0; display: none; }
  footer { margin-top: 64px; color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<div class="wrap">
  <header>
    <span class="badge"><b></b> <span id="count"></span> outils en ligne</span>
    <h1>Mes <span>outils</span>.</h1>
    <p>Applications, extensions et petits utilitaires que j'ai conçus et développés.</p>
  </header>

  <div class="controls">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Rechercher un outil…" aria-label="Rechercher">
    </label>
    <span id="filters" style="display:contents"></span>
  </div>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty">Aucun outil ne correspond.</p>

  <footer>© <span id="y"></span> <a href="https://github.com/jswale">jswale</a></footer>
</div>

<script>
// Les outils sont définis dans tools.json (name, icon, category, description, tags, url).
const grid = document.getElementById("grid"), empty = document.getElementById("empty");
const q = document.getElementById("q"), filters = document.getElementById("filters");
let TOOLS = [], cat = "Tous";
document.getElementById("y").textContent = new Date().getFullYear();

function setupFilters() {
  const cats = ["Tous", ...new Set(TOOLS.map(t => t.category))];
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === cat);
    b.onclick = () => { cat = c; [...filters.children].forEach(x => x.setAttribute("aria-pressed", x === b)); render(); };
    filters.appendChild(b);
  });
}

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

function render() {
  const term = q.value.trim().toLowerCase();
  const list = TOOLS.filter(t => (cat === "Tous" || t.category === cat) &&
    (!term || [t.name, t.description, ...(t.tags || [])].join(" ").toLowerCase().includes(term)));
  grid.innerHTML = list.map((t, i) => `
    <${t.private ? 'div class="card private"' : 'a class="card" href="' + esc(t.url) + '" target="_blank" rel="noopener"'} style="--i:${i}">
      <div class="top"><div class="icon" aria-hidden="true">${esc(t.icon || "🔧")}</div><span class="cat">${esc(t.category || "")}</span></div>
      <h2>${esc(t.name)}</h2>
      <p>${esc(t.description || "")}</p>
      <div class="tags">${(t.tags || []).map(g => `<span class="tag">${esc(g)}</span>`).join("")}</div>
      ${t.private ? '<span class="lock">🔒 Projet privé</span>' : `<span class="go">Ouvrir ${arrow}</span>`}
    </${t.private ? 'div' : 'a'}>`).join("");
  empty.style.display = list.length ? "none" : "block";
}
// Spotlight following the cursor
grid.addEventListener("pointermove", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (e.clientX - r.left) + "px");
  c.style.setProperty("--my", (e.clientY - r.top) + "px");
});
q.addEventListener("input", render);

fetch("tools.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    TOOLS = data;
    document.getElementById("count").textContent = TOOLS.length;
    setupFilters();
    render();
  })
  .catch(err => {
    empty.textContent = "Impossible de charger tools.json (" + err.message + "). En local, utilisez un serveur HTTP (ex. python -m http.server).";
    empty.style.display = "block";
  });
</script>
</body>
</html>
