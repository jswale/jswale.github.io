@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

* { box-sizing: border-box; }
.display { font-family: 'Bebas Neue', 'Space Grotesk', sans-serif; font-weight: 400; }
.mono { font-family: 'Space Mono', 'Space Grotesk', monospace; }

/* Largeur de la colonne principale ; s'élargit quand les scores sont ouverts */
.wrap { max-width: 860px; }
.stage { display: flex; flex-direction: column; }
.stage-main { min-width: 0; }
.board { margin-top: 18px; }
.clue { font-size: clamp(24px, 4.4vw, 42px); }

/* Grand écran : les scores passent à droite, le jeu prend plus de place */
@media (min-width: 1000px) {
  .wrap.wide { max-width: min(1640px, 95vw); }
  .stage.two-col { flex-direction: row; align-items: flex-start; gap: clamp(20px, 2.4vw, 40px); }
  .stage.two-col .stage-main { flex: 1 1 auto; min-width: 0; }
  .stage.two-col .stage-side { flex: 0 0 clamp(280px, 22%, 360px); position: sticky; top: 18px; }
  .stage.two-col .board { margin-top: 0; }
  /* Indice bien plus grand pour une lecture de loin (projection TV) */
  .stage.two-col .clue { font-size: clamp(40px, 3.6vw, 68px); line-height: 1.15; }
  .stage.two-col .ticket-main { padding: clamp(32px, 3.5vw, 56px); }
}

.bulb {
  width: 8px; height: 8px; border-radius: 50%;
  background: #E8B84B; box-shadow: 0 0 8px 1px rgba(232,184,75,0.75);
  animation: flick 1.6s ease-in-out infinite;
}
@keyframes flick { 0%,100% { opacity: 1; } 50% { opacity: 0.28; } }

.ticket-shell { perspective: 1400px; }
.ticket {
  display: flex; align-items: stretch;
  background: linear-gradient(160deg, #FBF4E4 0%, #F3E7CE 100%);
  border-radius: 18px;
  box-shadow: 0 30px 70px -30px rgba(0,0,0,0.75), 0 0 0 1px rgba(232,184,75,0.15);
  overflow: hidden;
  animation: dealIn .45s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes dealIn {
  from { opacity: 0; transform: translateY(14px) rotateX(8deg); }
  to   { opacity: 1; transform: translateY(0) rotateX(0); }
}
.ticket-main { flex: 1; padding: clamp(22px, 4vw, 40px); color: #1A1526; min-width: 0; }

.perf { position: relative; width: 0; border-left: 2px dashed rgba(26,21,38,0.28); }
.notch {
  position: absolute; left: -11px; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(120% 90% at 50% -10%, #221B3A 0%, #14111F 45%, #0E0B16 100%);
}
.notch-top { top: -11px; }
.notch-bottom { bottom: -11px; }

.ticket-stub {
  width: clamp(120px, 22vw, 190px);
  background: linear-gradient(160deg, #F0E2C4 0%, #E7D3AC 100%);
  display: flex; align-items: center; gap: 8px; padding: 16px 14px;
}

.stamp-in { animation: stampDrop .32s cubic-bezier(.2,.8,.3,1.4); }
@keyframes stampDrop { from { transform: scale(1.25); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.stamp {
  position: absolute; top: -6px; right: -2px; transform: rotate(-14deg);
  font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px;
  color: rgba(200,67,59,0.85); border: 3px solid rgba(200,67,59,0.7);
  border-radius: 6px; padding: 0 6px; line-height: 1.05; opacity: 0.9;
  pointer-events: none;
}

/* intro reel — amorce « mire » 3·2·1 */
.reel {
  position: relative;
  width: clamp(96px, 17vw, 138px); height: clamp(96px, 17vw, 138px);
  border-radius: 50%; overflow: hidden;
  border: 3px solid rgba(26,21,38,0.72);
  background: radial-gradient(circle, rgba(26,21,38,0.05) 0%, rgba(26,21,38,0.12) 72%, rgba(26,21,38,0.2) 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 6px rgba(251,244,228,0.35);
  animation: reelIn .3s ease-out;
}
@keyframes reelIn { from { transform: scale(.82); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.reel-sweep {
  position: absolute; inset: 0; border-radius: 50%; transform-origin: 50% 50%;
  background: conic-gradient(rgba(26,21,38,0.3) 0deg, rgba(26,21,38,0.08) 80deg, transparent 130deg, transparent 360deg);
  animation: sweep .8s linear;
}
@keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.reel-cross { position: absolute; background: rgba(26,21,38,0.32); }
.reel-cross-v { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
.reel-cross-h { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
.reel-num {
  position: relative; z-index: 2; font-size: clamp(48px, 9vw, 78px); line-height: 1;
  color: #1A1526; text-shadow: 0 2px 0 rgba(251,244,228,0.55);
  animation: reelPop .8s ease-out;
}
@keyframes reelPop { 0% { transform: scale(1.55); opacity: .15; } 30% { opacity: 1; } 100% { transform: scale(1); } }

/* podium — pop du score quand il change */
.pod-pop { animation: podPop .4s ease-out; display: inline-block; }
@keyframes podPop { 0% { transform: scale(1.6); } 45% { transform: scale(1.15); } 100% { transform: scale(1); } }
/* podium — colonne qui quitte le top 3 */
.pod-ghost { animation: podGhost .46s ease-in forwards; }
@keyframes podGhost { from { opacity: .9; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(22px) scale(.82); } }
/* podium — chevron de changement de rang (▲ monte / ▼ descend) */
.rank-fx { animation: rankFx 1.3s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes rankFx {
  0% { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.5); }
  22% { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.25); }
  70% { opacity: 1; transform: translateX(-50%) translateY(-6px) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(1); }
}

/* hover / focus micro-interactions */
.chip:hover { transform: translateY(-1px); }
.gear:hover { border-color: #E8B84B !important; color: #E8B84B !important; }
.ctrl:hover { background: rgba(242,237,228,0.12); border-color: rgba(242,237,228,0.4); }
.reveal:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -10px rgba(232,184,75,0.6); }
.link:hover { color: #F2EDE4; }
.add:hover, .score-btn:hover { filter: brightness(1.12); }
.x:hover { color: #C8433B; }

button:focus-visible, input:focus-visible, .chip:focus-visible {
  outline: 2px solid #E8B84B; outline-offset: 2px;
}

@media (max-width: 560px) {
  .ticket { flex-direction: column; }
  .perf { width: auto; height: 0; border-left: none; border-top: 2px dashed rgba(26,21,38,0.28); }
  .notch { left: auto; top: auto; }
  .notch-top { top: -11px; left: -11px; }
  .notch-bottom { bottom: auto; top: -11px; right: -11px; left: auto; }
  .ticket-stub { width: 100%; justify-content: center; padding: 22px 14px; }
  .stubLabel { writing-mode: horizontal-tb !important; transform: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  .ticket, .stamp-in, .bulb, .reel, .reel-sweep, .reel-num, .pod-pop, .pod-ghost, .rank-fx { animation: none !important; }
  .reveal:hover, .chip:hover { transform: none; }
}
