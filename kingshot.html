<style>

<body>
<canvas id="map"></canvas>

<div id="ui-overlay">
  <div id="alliance-header">
    <h1>Kingshot Alliance <span style="font-size:11px;color:#8888aa;letter-spacing:0">v1.0</span></h1>
    <div class="subtitle" id="member-count"></div>
  </div>

  <div id="legend">
    <h3>Buildings</h3>
    <div id="legend-items"></div>
  </div>

  <div id="info-panel">
    <span class="close-btn" onclick="closeInfoPanel()">&times;</span>
    <h3 id="info-title"></h3>
    <div id="info-content"></div>
  </div>

  <div id="set-coord-panel">
    <span class="close-btn" onclick="closeSetCoordPanel()">&times;</span>
    <h3>Set Coordinates</h3>
    <div id="set-coord-info"></div>
    <label>X</label>
    <input type="number" id="set-coord-x">
    <label>Y</label>
    <input type="number" id="set-coord-y">
    <div class="coord-hint">All tile coordinates will update relative to this reference.</div>
    <button class="submit-btn" onclick="submitSetCoord()">Apply</button>
  </div>

  <div id="add-panel">
    <span class="close-btn" onclick="closeAddPanel()">&times;</span>
    <h3>Add Member</h3>
    <div id="add-position"></div>
    <label>Player Name</label>
    <input type="text" id="add-name" placeholder="Enter name...">
    <label>Building</label>
    <select id="add-building" onchange="toggleLevelField()"></select>
    <div id="add-level-group">
      <label>Level</label>
      <select id="add-level"></select>
    </div>
    <button class="submit-btn" onclick="submitAddMember()">Place Building</button>
    <button class="action-btn set-coord-btn" onclick="showSetCoordFromAdd()">Set Coordinates</button>
  </div>

  <div id="expand-panel">
    <span class="label">Expand:</span>
    <button class="expand-btn" onclick="expandGrid('top')">&#9650; Top</button>
    <button class="expand-btn" onclick="expandGrid('bottom')">&#9660; Bottom</button>
    <button class="expand-btn" onclick="expandGrid('left')">&#9664; Left</button>
    <button class="expand-btn" onclick="expandGrid('right')">&#9654; Right</button>
    <span id="grid-size"></span>
  </div>

  <div id="io-panel">
    <button class="io-btn" onclick="exportData()">Export</button>
    <button class="io-btn" onclick="document.getElementById('import-file').click()">Import</button>
    <button class="io-btn" onclick="optimizeAroundBearTrap()">Optimize</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>

  <div id="controls-hint">
    Drag to pan &middot; Scroll to zoom &middot; Click tile for info
  </div>
</div>

<script>
// ─── Configuration ───────────────────────────────────────────────────
let GRID_COLS = 24;
let GRID_ROWS = 24;
const TILE_W = 80;
const TILE_H = 56;
const EXPAND_AMOUNT = 4;
let coordOffset = { col: 0, row: 0 };

// ─── Building Types (4 types with multi-tile footprints) ─────────────
const BUILDING_TYPES = {
  player:      { label: 'Player',      color: '#2980b9', roofColor: '#3498db', height: 18, size: 2 },
  bear_trap:   { label: 'Bear Trap',   color: '#c0392b', roofColor: '#e74c3c', height: 14, size: 3 },
  headquarter: { label: 'Head Quarter', color: '#d4a017', roofColor: '#f1c40f', height: 26, size: 3 },
  building:    { label: 'Other Building', color: '#8e44ad', roofColor: '#9b59b6', height: 16, size: 2 },
};

// ─── Sample Alliance Data ────────────────────────────────────────────
const PLAYER_NAMES = [
  'DragonLord','ShadowKnight','IronWolf','StormBreaker','FrostBite',
  'BlazeFury','NightHawk','ThunderGod','SilverFang','DarkPhoenix',
  'GoldRush','CrimsonKing','VoidWalker','SteelHeart','RuneMaster',
  'BoneReaper','FlameWarden','IceQueen','WindRunner','EarthShaker',
  'StarDust','MoonRider','SunChaser','DeathBringer','LifeKeeper',
  'SoulHunter','BloodRaven','GhostRider','StoneGuard','WildFire',
  'OceanDeep','SkyFall','WarHammer','SpellCaster','BladeDancer',
  'ArrowSmith','ShieldMaiden','BeastTamer','PlagueDoctor','HolyKnight',
  'DarkMage','LightBringer','SerpentKing','WolfPack','HawkEye',
  'TigerClaw','BearCub','FoxTrot','ViperStrike','CobraKai',
  'LionHeart','EagleScout','RavenClaw','PantherProwl','FalconWing',
  'DragonScale','PhoenixRise','GriffinRider','UnicornDust','KrakenDeep'
];

const BUILDING_KEYS = Object.keys(BUILDING_TYPES);

// ─── Levels ─────────────────────────────────────────────────────────
const LEVELS = [];
for (let i = 1; i <= 30; i++) LEVELS.push(String(i));
for (let i = 1; i <= 9; i++) LEVELS.push('TG' + i);

// ─── Display coordinates (with offset) ──────────────────────────────
function displayCol(col) { return col + coordOffset.col; }
function displayRow(row) { return row + coordOffset.row; }
function displayCoords(col, row) { return `(${displayCol(col)}, ${displayRow(row)})`; }

// ─── Grid helpers (multi-tile) ───────────────────────────────────────
// grid[row][col] stores the member object for every tile it occupies.
// member.plot is the top-left anchor tile.
let grid = Array.from({ length: GRID_ROWS }, () => Array(GRID_COLS).fill(null));

function canPlace(col, row, size) {
  if (col + size > GRID_COLS || row + size > GRID_ROWS) return false;
  for (let r = row; r < row + size; r++)
    for (let c = col; c < col + size; c++)
      if (grid[r][c] !== null) return false;
  return true;
}

function placeOnGrid(member) {
  const s = BUILDING_TYPES[member.building].size;
  const { col, row } = member.plot;
  for (let r = row; r < row + s; r++)
    for (let c = col; c < col + s; c++)
      grid[r][c] = member;
}

function removeFromGrid(member) {
  const s = BUILDING_TYPES[member.building].size;
  const { col, row } = member.plot;
  for (let r = row; r < row + s; r++)
    for (let c = col; c < col + s; c++)
      grid[r][c] = null;
}

// ─── Generate sample data ────────────────────────────────────────────
const alliance = { name: 'Kingshot', members: [] };

function generateAllianceData() {
  // Leader HQ at center
  const hqCol = 10, hqRow = 10;
  const leader = { name: 'DragonLord', plot: { col: hqCol, row: hqRow }, building: 'headquarter' };
  alliance.members.push(leader);
  placeOnGrid(leader);

  // Officers with HQs near center
  const officers = ['ShadowKnight', 'IronWolf', 'StormBreaker', 'FrostBite'];
  const offPlots = [{col:7,row:10},{col:10,row:7},{col:13,row:10},{col:10,row:13}];
  officers.forEach((name, i) => {
    const m = { name, plot: offPlots[i], building: 'headquarter' };
    if (canPlace(m.plot.col, m.plot.row, 3)) {
      alliance.members.push(m);
      placeOnGrid(m);
    }
  });

  // Fill remaining members randomly
  for (let i = 5; i < PLAYER_NAMES.length; i++) {
    const building = BUILDING_KEYS[Math.floor(Math.random() * BUILDING_KEYS.length)];
    const size = BUILDING_TYPES[building].size;
    const level = building === 'player' ? LEVELS[4 + Math.floor(Math.random() * (LEVELS.length - 4))] : null;
    let placed = false;
    for (let attempt = 0; attempt < 200; attempt++) {
      const col = Math.floor(Math.random() * (GRID_COLS - size + 1));
      const row = Math.floor(Math.random() * (GRID_ROWS - size + 1));
      if (canPlace(col, row, size)) {
        const m = { name: PLAYER_NAMES[i], plot: { col, row }, building };
        if (level) m.level = level;
        alliance.members.push(m);
        placeOnGrid(m);
        placed = true;
        break;
      }
    }
  }
}
// generateAllianceData();

// ─── Canvas Setup ────────────────────────────────────────────────────
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); render(); });

// ─── Camera ──────────────────────────────────────────────────────────
const camera = {
  x: 0,
  y: 0,
  zoom: 0.9,
};

// Center the map initially
function centerCamera() {
  // Center of the grid in world coordinates
  const centerCol = (GRID_COLS - 1) / 2;
  const centerRow = (GRID_ROWS - 1) / 2;
  const worldX = (centerCol - centerRow) * (TILE_W / 2);
  const worldY = (centerCol + centerRow) * (TILE_H / 2);
  camera.x = width / 2 - worldX * camera.zoom;
  camera.y = height / 2 - worldY * camera.zoom;
}

// ─── Isometric Projection ────────────────────────────────────────────
function gridToScreen(col, row) {
  const x = (col - row) * (TILE_W / 2);
  const y = (col + row) * (TILE_H / 2);
  return {
    x: x * camera.zoom + camera.x,
    y: y * camera.zoom + camera.y
  };
}

function screenToGrid(sx, sy) {
  const wx = (sx - camera.x) / camera.zoom;
  const wy = (sy - camera.y) / camera.zoom;
  const col = (wx / (TILE_W / 2) + wy / (TILE_H / 2)) / 2;
  const row = (wy / (TILE_H / 2) - wx / (TILE_W / 2)) / 2;
  // Tiles are centred on integer grid coords (see drawTile), so round, not floor
  return { col: Math.round(col), row: Math.round(row) };
}

// ─── Drawing Functions ───────────────────────────────────────────────
function drawTile(col, row, fillColor, strokeColor) {
  const { x, y } = gridToScreen(col, row);
  const hw = (TILE_W / 2) * camera.zoom;
  const hh = (TILE_H / 2) * camera.zoom;

  ctx.beginPath();
  ctx.moveTo(x, y - hh);
  ctx.lineTo(x + hw, y);
  ctx.lineTo(x, y + hh);
  ctx.lineTo(x - hw, y);
  ctx.closePath();

  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawBuildingBorder(member) {
  const bt = BUILDING_TYPES[member.building];
  const s = bt.size;
  const z = camera.zoom;

  // Outer diamond around the full footprint
  const centerCol = member.plot.col + (s - 1) / 2;
  const centerRow = member.plot.row + (s - 1) / 2;
  const { x: cx, y: cy } = gridToScreen(centerCol, centerRow);
  const hw = (TILE_W / 2) * s * z;
  const hh = (TILE_H / 2) * s * z;

  ctx.beginPath();
  ctx.moveTo(cx, cy - hh);
  ctx.lineTo(cx + hw, cy);
  ctx.lineTo(cx, cy + hh);
  ctx.lineTo(cx - hw, cy);
  ctx.closePath();
  ctx.strokeStyle = darken(bt.color, 0.5);
  ctx.lineWidth = 2.5 * z;
  ctx.stroke();
}

function drawBuildingLabel(member) {
  const bt = BUILDING_TYPES[member.building];
  const s = bt.size;
  const z = camera.zoom;

  // Center of the multi-tile footprint
  const centerCol = member.plot.col + (s - 1) / 2;
  const centerRow = member.plot.row + (s - 1) / 2;
  const { x: cx, y: cy } = gridToScreen(centerCol, centerRow);

  const isPlayer = member.building === 'player';
  const isT = isPlayer && String(member.level).startsWith('TG');
  const label = isT ? member.name + ' \u{1F451}' : member.name;

  let yOff = 0;
  // Player name (+ crown for T-levels)
  ctx.font = `bold ${Math.max(8, 11 * z)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillText(label, cx + 1, cy - 6 * z + 1);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, cx, cy - 6 * z);
  yOff += 10 * z;

  // Level for players
  if (isPlayer && member.level) {
    const lvText = String(member.level).startsWith('TG') ? member.level : 'Lv.' + member.level;
    ctx.font = `${Math.max(7, 9 * z)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(lvText, cx, cy - 6 * z + yOff);
    yOff += 10 * z;
  }

  // Coordinates
  ctx.font = `${Math.max(6, 8 * z)}px sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText(displayCoords(member.plot.col, member.plot.row), cx, cy - 6 * z + yOff);
}

function darken(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((num >> 16) & 0xff) * (1 - amount));
  const g = Math.max(0, ((num >> 8) & 0xff) * (1 - amount));
  const b = Math.max(0, (num & 0xff) * (1 - amount));
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

function lighten(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((num >> 16) & 0xff) + (255 - ((num >> 16) & 0xff)) * amount);
  const g = Math.min(255, ((num >> 8) & 0xff) + (255 - ((num >> 8) & 0xff)) * amount);
  const b = Math.min(255, (num & 0xff) + (255 - (num & 0xff)) * amount);
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// ─── Move Arrows ─────────────────────────────────────────────────────
function getMoveArrowPositions(member) {
  const bt = BUILDING_TYPES[member.building];
  const s = bt.size;
  const z = camera.zoom;
  const centerCol = member.plot.col + (s - 1) / 2;
  const centerRow = member.plot.row + (s - 1) / 2;
  const offset = (s / 2 + 0.8);
  const r = 12 * z;
  return [
    { dir: 'top',    ...gridToScreen(centerCol, centerRow - offset), label: '\u25B2', dc: 0, dr: -1, r },
    { dir: 'bottom', ...gridToScreen(centerCol, centerRow + offset), label: '\u25BC', dc: 0, dr: 1, r },
    { dir: 'left',   ...gridToScreen(centerCol - offset, centerRow), label: '\u25C0', dc: -1, dr: 0, r },
    { dir: 'right',  ...gridToScreen(centerCol + offset, centerRow), label: '\u25B6', dc: 1, dr: 0, r },
  ];
}

function drawMoveArrows(member) {
  const arrows = getMoveArrowPositions(member);
  const z = camera.zoom;
  arrows.forEach(a => {
    // Check if move is possible
    const newCol = member.plot.col + a.dc;
    const newRow = member.plot.row + a.dr;
    const s = BUILDING_TYPES[member.building].size;
    // Temporarily remove from grid to check placement
    removeFromGrid(member);
    const possible = canPlace(newCol, newRow, s);
    placeOnGrid(member);

    // Draw circle
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    ctx.fillStyle = possible ? 'rgba(39, 174, 96, 0.8)' : 'rgba(100, 100, 100, 0.4)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Draw arrow symbol
    ctx.font = `bold ${Math.max(8, 11 * z)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = possible ? '#fff' : 'rgba(255,255,255,0.4)';
    ctx.fillText(a.label, a.x, a.y);
  });
}

function moveMember(member, dc, dr) {
  const s = BUILDING_TYPES[member.building].size;
  const newCol = member.plot.col + dc;
  const newRow = member.plot.row + dr;
  removeFromGrid(member);
  if (!canPlace(newCol, newRow, s)) {
    placeOnGrid(member);
    return;
  }
  member.plot.col = newCol;
  member.plot.row = newRow;
  placeOnGrid(member);
  selectedTile = { col: newCol, row: newRow };
  showInfoPanel(member);
  saveToStorage();
  render();
}

// ─── Rendering ───────────────────────────────────────────────────────
let hoveredTile = null;
let selectedTile = null;

function getMemberAt(col, row) {
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return null;
  return grid[row][col];
}

function render() {
  ctx.clearRect(0, 0, width, height);

  // Draw background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#16213e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Determine which member is hovered/selected
  const hoveredMember = hoveredTile ? getMemberAt(hoveredTile.col, hoveredTile.row) : null;
  const selectedMember = selectedTile ? getMemberAt(selectedTile.col, selectedTile.row) : null;

  // Track which buildings have been drawn (draw once per member)
  const drawnMembers = new Set();

  // Draw tiles back-to-front (painter's algorithm)
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const member = grid[row][col];

      let tileColor = '#2d5a1e';
      let strokeColor = '#3a7a28';

      if ((col + row) % 2 === 0) {
        tileColor = '#2a5219';
        strokeColor = '#357022';
      }

      // Occupied tiles get the building color
      if (member) {
        const bt = BUILDING_TYPES[member.building];
        tileColor = bt.color;
        strokeColor = darken(bt.color, 0.3);
      }

      // Highlight for hovered/selected building
      if (member && member === selectedMember) {
        tileColor = lighten(BUILDING_TYPES[member.building].color, 0.3);
        strokeColor = '#ffd700';
      } else if (member && member === hoveredMember) {
        tileColor = lighten(BUILDING_TYPES[member.building].color, 0.15);
        strokeColor = '#ffffff';
      } else if (!member && hoveredTile && hoveredTile.col === col && hoveredTile.row === row) {
        tileColor = '#3a7a2a';
        strokeColor = '#88cc66';
      }

      drawTile(col, row, tileColor, strokeColor);
    }
  }

  // Draw building borders (outline around full footprint)
  alliance.members.forEach(m => drawBuildingBorder(m));

  // Draw labels on top of tiles (second pass so text is never obscured)
  alliance.members.forEach(m => drawBuildingLabel(m));

  // Draw move arrows around selected building
  if (selectedMember) {
    drawMoveArrows(selectedMember);
  }

  // Draw coordinates on empty tiles
  const z = camera.zoom;
  if (z > 0.4) {
    ctx.font = `${Math.max(6, 8 * z)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for (let row = 0; row < GRID_ROWS; row++) {
      for (let col = 0; col < GRID_COLS; col++) {
        if (!grid[row][col]) {
          const { x, y } = gridToScreen(col, row);
          ctx.fillText(displayCoords(col, row), x, y);
        }
      }
    }
  }
}

// ─── Interaction: Pan ────────────────────────────────────────────────
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let cameraStart = { x: 0, y: 0 };

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  cameraStart = { x: camera.x, y: camera.y };
  canvas.classList.add('dragging');
});

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) {
    camera.x = cameraStart.x + (e.clientX - dragStart.x);
    camera.y = cameraStart.y + (e.clientY - dragStart.y);
    render();
    return;
  }

  const g = screenToGrid(e.clientX, e.clientY);
  if (g.col >= 0 && g.col < GRID_COLS && g.row >= 0 && g.row < GRID_ROWS) {
    hoveredTile = g;
    canvas.style.cursor = 'pointer';
  } else {
    hoveredTile = null;
    canvas.style.cursor = 'grab';
  }
  render();
});

canvas.addEventListener('mouseup', (e) => {
  const wasDrag = Math.abs(e.clientX - dragStart.x) > 3 || Math.abs(e.clientY - dragStart.y) > 3;
  isDragging = false;
  canvas.classList.remove('dragging');

  if (!wasDrag) {
    // Check if clicking a move arrow
    if (selectedTile) {
      const selMember = getMemberAt(selectedTile.col, selectedTile.row);
      if (selMember) {
        const arrows = getMoveArrowPositions(selMember);
        for (const a of arrows) {
          const dx = e.clientX - a.x, dy = e.clientY - a.y;
          if (dx * dx + dy * dy <= a.r * a.r) {
            moveMember(selMember, a.dc, a.dr);
            return;
          }
        }
      }
    }

    const g = screenToGrid(e.clientX, e.clientY);
    if (g.col >= 0 && g.col < GRID_COLS && g.row >= 0 && g.row < GRID_ROWS) {
      const member = grid[g.row][g.col];
      if (member) {
        selectedTile = { col: member.plot.col, row: member.plot.row };
        closeAddPanel();
        showInfoPanel(member);
      } else {
        selectedTile = g;
        closeInfoPanel();
        showAddPanel(g.col, g.row);
      }
    } else {
      selectedTile = null;
      closeInfoPanel();
      closeAddPanel();
    }
    render();
  }
});

canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  hoveredTile = null;
  canvas.classList.remove('dragging');
  render();
});

// ─── Interaction: Zoom ───────────────────────────────────────────────
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  const newZoom = Math.max(0.3, Math.min(3, camera.zoom * zoomFactor));

  // Zoom toward cursor position
  const mx = e.clientX;
  const my = e.clientY;
  camera.x = mx - (mx - camera.x) * (newZoom / camera.zoom);
  camera.y = my - (my - camera.y) * (newZoom / camera.zoom);
  camera.zoom = newZoom;

  render();
}, { passive: false });

// ─── Touch support ───────────────────────────────────────────────────
let lastTouchDist = 0;
let lastTouchCenter = { x: 0, y: 0 };

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    cameraStart = { x: camera.x, y: camera.y };
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
    lastTouchCenter = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && isDragging) {
    camera.x = cameraStart.x + (e.touches[0].clientX - dragStart.x);
    camera.y = cameraStart.y + (e.touches[0].clientY - dragStart.y);
    render();
  } else if (e.touches.length === 2) {
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const center = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };

    const scale = dist / lastTouchDist;
    const newZoom = Math.max(0.3, Math.min(3, camera.zoom * scale));
    camera.x = center.x - (center.x - camera.x) * (newZoom / camera.zoom);
    camera.y = center.y - (center.y - camera.y) * (newZoom / camera.zoom);
    camera.zoom = newZoom;

    lastTouchDist = dist;
    lastTouchCenter = center;
    render();
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0 && isDragging) {
    isDragging = false;
  }
});

// ─── Info Panel ──────────────────────────────────────────────────────
// Distance (in tiles) between the building's centre and the centre of the nearest other Bear Trap
function distanceToNearestTrapRow(member) {
  const centre = m => {
    const s = BUILDING_TYPES[m.building].size;
    return { c: m.plot.col + (s - 1) / 2, r: m.plot.row + (s - 1) / 2 };
  };
  const me = centre(member);
  let best = null;
  alliance.members.forEach(m => {
    if (m === member || m.building !== 'bear_trap') return;
    const t = centre(m);
    const d = Math.hypot(me.c - t.c, me.r - t.r);
    if (!best || d < best.d) best = { d, name: m.name };
  });
  if (!best) return '';
  return `<div class="info-row"><span class="info-label">Nearest Bear Trap</span><span class="info-value">${best.d.toFixed(1)} cases (${best.name})</span></div>`;
}

function showInfoPanel(member) {
  const panel = document.getElementById('info-panel');
  const bt = BUILDING_TYPES[member.building];
  document.getElementById('info-title').textContent = member.name;
  document.getElementById('info-content').innerHTML = `
    <div class="info-row"><span class="info-label">Building</span><span class="info-value">${bt.label} (${bt.size}x${bt.size})</span></div>
    ${member.building === 'player' ? `<div class="info-row"><span class="info-label">Level</span><span class="info-value">${member.level}</span></div>` : ''}
    <div class="info-row"><span class="info-label">Position</span><span class="info-value">${displayCoords(member.plot.col, member.plot.row)}</span></div>
    ${distanceToNearestTrapRow(member)}
    <button class="action-btn set-coord-btn" onclick="showSetCoordPanel(${member.plot.col}, ${member.plot.row})">Set Coordinates</button>
    <button class="action-btn set-coord-btn" onclick="renameMember(${member.plot.col}, ${member.plot.row})">Edit Name</button>
    <button class="action-btn remove-btn" onclick="removeMember(${member.plot.col}, ${member.plot.row})">Remove</button>
  `;
  panel.style.display = 'block';
}

function closeInfoPanel() {
  document.getElementById('info-panel').style.display = 'none';
}

// ─── Edit Name ───────────────────────────────────────────────────────
function renameMember(col, row) {
  const member = grid[row][col];
  if (!member) return;
  const name = prompt('Nouveau nom du bâtiment :', member.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  member.name = trimmed;
  saveToStorage();
  showInfoPanel(member);
  render();
}

// ─── Optimize around Bear Trap ───────────────────────────────────────
// Level rank: T-levels above numeric ones, higher level first
function levelRank(level) {
  const s = String(level);
  return s.startsWith('TG') ? 100 + parseInt(s.slice(2)) : parseInt(s) || 0;
}

// How strongly a building is pulled towards the trap: TG8 > TG7 > TG6 > the rest
function distWeight(member) {
  if (member.building !== 'player') return 1;
  const s = String(member.level);
  const t = s.startsWith('TG') ? parseInt(s.slice(2)) : 0;
  return 1 + Math.max(0, t - 5);
}

// Number of occupied tiles sharing an edge with the footprint (higher = more compact)
function edgeContact(col, row, size) {
  let contact = 0;
  for (let i = 0; i < size; i++) {
    if (getCellOccupied(col + i, row - 1)) contact++;
    if (getCellOccupied(col + i, row + size)) contact++;
    if (getCellOccupied(col - 1, row + i)) contact++;
    if (getCellOccupied(col + size, row + i)) contact++;
  }
  return contact;
}

function getCellOccupied(col, row) {
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return false;
  return grid[row][col] !== null;
}

// Holes = empty tiles inside the layout that are either walled in (not reachable from
// outside the bounding box) or notches touching 3+ buildings. occ is a flat 0/1 array.
function countLayoutHoles(occ, minC, minR, maxC, maxR) {
  const W = maxC - minC + 3, H = maxR - minR + 3; // one-tile margin around the box
  const isOcc = (c, r) => c >= 0 && r >= 0 && c < GRID_COLS && r < GRID_ROWS && occ[r * GRID_COLS + c] === 1;
  const reached = new Uint8Array(W * H);
  const stack = [];
  for (let x = 0; x < W; x++) { stack.push([x, 0]); stack.push([x, H - 1]); }
  for (let y = 0; y < H; y++) { stack.push([0, y]); stack.push([W - 1, y]); }
  while (stack.length) {
    const [x, y] = stack.pop();
    if (x < 0 || y < 0 || x >= W || y >= H || reached[y * W + x]) continue;
    if (isOcc(x + minC - 1, y + minR - 1)) continue;
    reached[y * W + x] = 1;
    stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  let holes = 0;
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      if (isOcc(c, r)) continue;
      const x = c - minC + 1, y = r - minR + 1;
      const walls = (isOcc(c - 1, r) ? 1 : 0) + (isOcc(c + 1, r) ? 1 : 0) +
                    (isOcc(c, r - 1) ? 1 : 0) + (isOcc(c, r + 1) ? 1 : 0);
      if (!reached[y * W + x] || walls >= 3) holes++;
    }
  }
  return holes;
}

function optimizeAroundBearTrap() {
  const selected = selectedTile ? getMemberAt(selectedTile.col, selectedTile.row) : null;
  const trap = selected?.building === 'bear_trap'
    ? selected
    : alliance.members.find(m => m.building === 'bear_trap');
  if (!trap) { alert('Aucun Bear Trap sur la carte.'); return; }

  // Everything except the chosen trap gets repositioned
  const movable = alliance.members.filter(m => m !== trap);
  if (movable.length === 0) return;
  if (!confirm(`Réorganiser ${movable.length} bâtiment(s) autour du Bear Trap ${trap.name} ? Les positions actuelles ne seront pas restaurées.`)) return;

  const originals = movable.map(m => ({ member: m, plot: { ...m.plot } }));
  const restore = () => {
    movable.forEach(m => removeFromGrid(m));
    originals.forEach(o => { o.member.plot = o.plot; placeOnGrid(o.member); });
  };

  // Lift everything movable off the grid; the trap stays as the anchor
  movable.forEach(m => removeFromGrid(m));

  const ts = BUILDING_TYPES[trap.building].size;
  const tc = trap.plot.col, tr = trap.plot.row;
  // Players first (highest level closest to the trap), then other buildings
  // (largest first) fill the remaining spots further out
  const sorted = [...movable].sort((a, b) => {
    const groupA = a.building === 'player' ? 0 : 1;
    const groupB = b.building === 'player' ? 0 : 1;
    if (groupA !== groupB) return groupA - groupB;
    if (groupA === 0) return levelRank(b.level) - levelRank(a.level);
    return BUILDING_TYPES[b.building].size - BUILDING_TYPES[a.building].size;
  });

  // Count empty tiles inside the bounding box of the trap and the placed buildings
  const countHoles = (members) => {
    let minC = Infinity, minR = Infinity, maxC = -Infinity, maxR = -Infinity;
    members.forEach(m => {
      const s = BUILDING_TYPES[m.building].size;
      minC = Math.min(minC, m.plot.col); minR = Math.min(minR, m.plot.row);
      maxC = Math.max(maxC, m.plot.col + s - 1); maxR = Math.max(maxR, m.plot.row + s - 1);
    });
    let holes = 0;
    for (let r = minR; r <= maxR; r++)
      for (let c = minC; c <= maxC; c++)
        if (!grid[r][c]) holes++;
    return holes;
  };

  const origin = new Map(originals.map(o => [o.member, o.plot]));
  const toPlace = sorted;
  // Bonus for staying on the current tile: a building only moves when packing gains more than this
  const STAY_BONUS = 1500;

  // Greedy packing is order-sensitive, so try several noisy runs
  // and keep the best trade-off between empty tiles and number of moves
  const TRIALS = 200;
  let bestPlots = null, bestScore = Infinity, bestHoles = 0;
  for (let t = 0; t < TRIALS; t++) {
    const placed = [];
    let ok = true;
    for (const p of toPlace) {
      const s = BUILDING_TYPES[p.building].size;
      const home = origin.get(p);
      let best = null, bestCost = Infinity;
      for (let r = 0; r + s <= GRID_ROWS; r++) {
        for (let c = 0; c + s <= GRID_COLS; c++) {
          if (!canPlace(c, r, s)) continue;
          // Pack against what is already placed (trap included), then stay close to the trap centre
          const contact = edgeContact(c, r, s);
          const dist = Math.hypot(c + s / 2 - (tc + ts / 2), r + s / 2 - (tr + ts / 2));
          const noise = t === 0 ? 1 : 1 + Math.random() * 0.8;
          const stay = c === home.col && r === home.row ? STAY_BONUS : 0;
          const cost = -contact * 1000 - stay + dist * noise;
          if (cost < bestCost) { bestCost = cost; best = { c, r }; }
        }
      }
      if (!best) { ok = false; break; }
      p.plot = { col: best.c, row: best.r };
      placeOnGrid(p);
      placed.push(p);
    }
    if (ok) {
      const holes = countHoles([trap, ...placed]);
      const moves = placed.filter(p => {
        const o = origin.get(p);
        return o.col !== p.plot.col || o.row !== p.plot.row;
      }).length;
      // Empty tiles weigh much more than moves: a gap is worse than relocating a building
      const score = holes * 10 + moves;
      if (score < bestScore) {
        bestScore = score;
        bestHoles = holes;
        bestPlots = toPlace.map(m => ({ ...m.plot }));
      }
    }
    placed.forEach(p => removeFromGrid(p));
  }

  if (!bestPlots) { restore(); alert('Pas assez de place autour du Bear Trap pour tous les bâtiments.'); return; }
  // Local search: start from the greedy layout and nudge buildings to remove the holes,
  // while penalising every building that leaves its original tile and any spread from the trap.
  // Several restarts; keep the run with the fewest holes, then the fewest moves.
  {
    const occ = new Uint8Array(GRID_ROWS * GRID_COLS);
    const mark = (c, r, s, v) => {
      for (let y = r; y < r + s; y++) for (let x = c; x < c + s; x++) occ[y * GRID_COLS + x] = v;
    };
    const isFree = (c, r, s) => {
      for (let y = r; y < r + s; y++) for (let x = c; x < c + s; x++) if (occ[y * GRID_COLS + x]) return false;
      return true;
    };
    const statsOf = (list) => {
      const occL = new Uint8Array(GRID_ROWS * GRID_COLS);
      let minC = tc, minR = tr, maxC = tc + ts - 1, maxR = tr + ts - 1, moves = 0, spread = 0;
      for (let y = tr; y < tr + ts; y++) for (let x = tc; x < tc + ts; x++) occL[y * GRID_COLS + x] = 1;
      list.forEach((f, i) => {
        for (let y = f.r; y < f.r + f.s; y++) for (let x = f.c; x < f.c + f.s; x++) occL[y * GRID_COLS + x] = 1;
        minC = Math.min(minC, f.c); minR = Math.min(minR, f.r);
        maxC = Math.max(maxC, f.c + f.s - 1); maxR = Math.max(maxR, f.r + f.s - 1);
        const o = origin.get(toPlace[i]);
        if (o.col !== f.c || o.row !== f.r) moves++;
        const d = Math.hypot(f.c + f.s / 2 - (tc + ts / 2), f.r + f.s / 2 - (tr + ts / 2));
        spread += toPlace[i].building === 'player' ? distWeight(toPlace[i]) * d : -0.5 * d;
      });
      return { holes: countLayoutHoles(occL, minC, minR, maxC, maxR), moves, spread, score: moves + spread };
    };

    const anneal = (startPlots) => {
      occ.fill(0);
      const cur = startPlots.map((p, i) => ({ c: p.col, r: p.row, s: BUILDING_TYPES[toPlace[i].building].size }));
      mark(tc, tr, ts, 1);
      cur.forEach(f => mark(f.c, f.r, f.s, 1));

      // Energy: holes (heavy) + moves + a small pull towards the trap
      const energy = () => {
        let minC = tc, minR = tr, maxC = tc + ts - 1, maxR = tr + ts - 1, moves = 0, spread = 0;
        cur.forEach((f, i) => {
          minC = Math.min(minC, f.c); minR = Math.min(minR, f.r);
          maxC = Math.max(maxC, f.c + f.s - 1); maxR = Math.max(maxR, f.r + f.s - 1);
          const o = origin.get(toPlace[i]);
          if (o.col !== f.c || o.row !== f.r) moves++;
          const d = Math.hypot(f.c + f.s / 2 - (tc + ts / 2), f.r + f.s / 2 - (tr + ts / 2));
          spread += toPlace[i].building === 'player' ? distWeight(toPlace[i]) * d : -0.5 * d;
        });
        return 10 * countLayoutHoles(occ, minC, minR, maxC, maxR) + moves + spread;
      };

      let E = energy(), bestE = E, best = cur.map(f => ({ ...f }));
      const ITER = 150000, T0 = 3, T1 = 0.05, RANGE = 3;
      for (let it = 0; it < ITER && bestE > 0; it++) {
        const T = T0 * Math.pow(T1 / T0, it / ITER);
        // Swap two same-size buildings: occupancy is unchanged, so only level order and moves change
        if (Math.random() < 0.3) {
          const a = cur[Math.floor(Math.random() * cur.length)];
          const b = cur[Math.floor(Math.random() * cur.length)];
          if (a === b || a.s !== b.s) continue;
          [a.c, b.c] = [b.c, a.c];
          [a.r, b.r] = [b.r, a.r];
          const E2 = energy();
          if (E2 <= E || Math.random() < Math.exp((E - E2) / T)) {
            E = E2;
            if (E < bestE) { bestE = E; best = cur.map(x => ({ ...x })); }
          } else {
            [a.c, b.c] = [b.c, a.c];
            [a.r, b.r] = [b.r, a.r];
          }
          continue;
        }
        const f = cur[Math.floor(Math.random() * cur.length)];
        const nc = f.c + Math.floor(Math.random() * (2 * RANGE + 1)) - RANGE;
        const nr = f.r + Math.floor(Math.random() * (2 * RANGE + 1)) - RANGE;
        if ((nc === f.c && nr === f.r) || nc < 0 || nr < 0 || nc + f.s > GRID_COLS || nr + f.s > GRID_ROWS) continue;
        mark(f.c, f.r, f.s, 0);
        if (!isFree(nc, nr, f.s)) { mark(f.c, f.r, f.s, 1); continue; }
        const oldC = f.c, oldR = f.r;
        f.c = nc; f.r = nr; mark(nc, nr, f.s, 1);
        const E2 = energy();
        if (E2 <= E || Math.random() < Math.exp((E - E2) / T)) {
          E = E2;
          if (E < bestE) { bestE = E; best = cur.map(x => ({ ...x })); }
        } else {
          mark(nc, nr, f.s, 0); f.c = oldC; f.r = oldR; mark(oldC, oldR, f.s, 1);
        }
      }
      return { plots: best.map(f => ({ col: f.c, row: f.r })), ...statsOf(best) };
    };

    // Restart until a hole-free layout is found (or give up after MAX_RESTARTS to keep the UI responsive)
    // Among hole-free runs, keep the one with the best trade-off between moves and level order
    // Stop early once a hole-free run has been compared against a few others
    const MAX_RESTARTS = 10;
    let winner = null;
    for (let k = 0; k < MAX_RESTARTS; k++) {
      const res = anneal(bestPlots);
      if (!winner || res.holes < winner.holes || (res.holes === winner.holes && res.score < winner.score)) winner = res;
      if (winner.holes === 0 && k >= 2) break;
    }
    bestPlots = winner.plots;
    bestHoles = winner.holes;
  }

  // Final pass: the set of player footprints is fixed, so hand the closest spots to the
  // highest levels (TG8, then TG7, then TG6...). Occupancy does not change.
  {
    const trapDist = p => Math.hypot(p.col + 1 - (tc + ts / 2), p.row + 1 - (tr + ts / 2));
    const playerIdx = toPlace.map((m, i) => i).filter(i => toPlace[i].building === 'player');
    const slots = playerIdx.map(i => bestPlots[i]).sort((a, b) => trapDist(a) - trapDist(b));
    playerIdx.sort((i, j) => levelRank(toPlace[j].level) - levelRank(toPlace[i].level))
      .forEach((i, k) => { bestPlots[i] = { ...slots[k] }; });
  }

  // Holes of the final layout, for the console report
  {
    const occ = new Uint8Array(GRID_ROWS * GRID_COLS);
    let minC = tc, minR = tr, maxC = tc + ts - 1, maxR = tr + ts - 1;
    const add = (c, r, s) => {
      minC = Math.min(minC, c); minR = Math.min(minR, r);
      maxC = Math.max(maxC, c + s - 1); maxR = Math.max(maxR, r + s - 1);
      for (let y = r; y < r + s; y++) for (let x = c; x < c + s; x++) occ[y * GRID_COLS + x] = 1;
    };
    add(tc, tr, ts);
    toPlace.forEach((m, i) => add(bestPlots[i].col, bestPlots[i].row, BUILDING_TYPES[m.building].size));
    bestHoles = countLayoutHoles(occ, minC, minR, maxC, maxR);
  }

  toPlace.forEach((m, i) => { m.plot = bestPlots[i]; placeOnGrid(m); });

  const moves = toPlace.filter(m => {
    const o = origin.get(m);
    return o.col !== m.plot.col || o.row !== m.plot.row;
  }).length;
  console.log(`Optimize : ${moves} déplacement(s) sur ${toPlace.length} bâtiment(s) (${bestHoles} case(s) vide(s) dans la zone)`);

  saveToStorage();
  render();
}

// ─── Remove Member ───────────────────────────────────────────────────
function removeMember(col, row) {
  const member = grid[row][col];
  if (!member) return;
  removeFromGrid(member);
  const idx = alliance.members.indexOf(member);
  if (idx !== -1) alliance.members.splice(idx, 1);
  selectedTile = null;
  closeInfoPanel();
  updateMemberCount();
  saveToStorage();
  render();
}

// ─── Add Panel ───────────────────────────────────────────────────────
let addPanelTarget = null;

function toggleLevelField() {
  const building = document.getElementById('add-building').value;
  document.getElementById('add-level-group').style.display = building === 'player' ? '' : 'none';
}

function showAddPanel(col, row) {
  addPanelTarget = { col, row };
  const panel = document.getElementById('add-panel');
  document.getElementById('add-position').innerHTML =
    `<div style="font-size:12px;color:#8888aa;margin-bottom:4px">Tile ${displayCoords(col, row)}</div>`;
  document.getElementById('add-name').value = '';
  const levelSel = document.getElementById('add-level');
  if (levelSel.options.length === 0) {
    // Dropdown only offers level 30 and above (and the T-levels)
    LEVELS.filter(lv => lv.startsWith('TG') || parseInt(lv) >= 30).forEach(lv => {
      const opt = document.createElement('option');
      opt.value = lv;
      opt.textContent = lv;
      levelSel.appendChild(opt);
    });
  }
  levelSel.value = '30';
  const sel = document.getElementById('add-building');
  if (sel.options.length === 0) {
    for (const [key, bt] of Object.entries(BUILDING_TYPES)) {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = `${bt.label} (${bt.size}x${bt.size})`;
      sel.appendChild(opt);
    }
  }
  panel.style.display = 'block';
  toggleLevelField();
  document.getElementById('add-name').focus();
}

function closeAddPanel() {
  document.getElementById('add-panel').style.display = 'none';
  addPanelTarget = null;
}

function submitAddMember() {
  if (!addPanelTarget) return;
  const name = document.getElementById('add-name').value.trim();
  if (!name) { document.getElementById('add-name').focus(); return; }
  const building = document.getElementById('add-building').value;
  const level = document.getElementById('add-level').value;
  const { col, row } = addPanelTarget;
  const size = BUILDING_TYPES[building].size;

  if (!canPlace(col, row, size)) {
    alert(`Not enough space for a ${size}x${size} building at ${displayCoords(col, row)}. Try another tile.`);
    return;
  }

  const member = { name, plot: { col, row }, building };
  if (building === 'player') member.level = level;
  placeOnGrid(member);
  alliance.members.push(member);

  selectedTile = { col, row };
  closeAddPanel();
  showInfoPanel(member);
  updateMemberCount();
  saveToStorage();
  render();
}

function updateMemberCount() {
  document.getElementById('member-count').textContent = `${alliance.members.length} Members`;
}

// ─── Set Coordinates ─────────────────────────────────────────────
let setCoordTarget = null;

function showSetCoordPanel(col, row) {
  setCoordTarget = { col, row };
  closeInfoPanel();
  const panel = document.getElementById('set-coord-panel');
  document.getElementById('set-coord-info').innerHTML =
    `<div style="font-size:12px;color:#8888aa;margin-bottom:4px">Tile ${displayCoords(col, row)}</div>`;
  document.getElementById('set-coord-x').value = displayCol(col);
  document.getElementById('set-coord-y').value = displayRow(row);
  panel.style.display = 'block';
  document.getElementById('set-coord-x').focus();
}

function closeSetCoordPanel() {
  document.getElementById('set-coord-panel').style.display = 'none';
  setCoordTarget = null;
}

function showSetCoordFromAdd() {
  if (!addPanelTarget) return;
  const { col, row } = addPanelTarget;
  closeAddPanel();
  showSetCoordPanel(col, row);
}

function submitSetCoord() {
  if (!setCoordTarget) return;
  const newX = parseInt(document.getElementById('set-coord-x').value);
  const newY = parseInt(document.getElementById('set-coord-y').value);
  if (isNaN(newX) || isNaN(newY)) return;
  coordOffset.col = newX - setCoordTarget.col;
  coordOffset.row = newY - setCoordTarget.row;
  closeSetCoordPanel();
  saveToStorage();
  render();
}

// ─── Legend ───────────────────────────────────────────────────────────
function buildLegend() {
  const container = document.getElementById('legend-items');
  for (const [key, bt] of Object.entries(BUILDING_TYPES)) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-color" style="background:${bt.color}"></div><span>${bt.label}</span>`;
    container.appendChild(item);
  }
}

// ─── Expand Grid ─────────────────────────────────────────────────────
function expandGrid(direction) {
  const n = EXPAND_AMOUNT;
  let colShift = 0, rowShift = 0;

  switch (direction) {
    case 'top':
      GRID_ROWS += n;
      rowShift = n;
      break;
    case 'bottom':
      GRID_ROWS += n;
      break;
    case 'left':
      GRID_COLS += n;
      colShift = n;
      break;
    case 'right':
      GRID_COLS += n;
      break;
  }

  // Shift all member positions if expanding top or left
  if (colShift || rowShift) {
    alliance.members.forEach(m => {
      m.plot.col += colShift;
      m.plot.row += rowShift;
    });
  }

  // Rebuild grid
  grid = Array.from({ length: GRID_ROWS }, () => Array(GRID_COLS).fill(null));
  alliance.members.forEach(m => placeOnGrid(m));

  updateGridSize();
  centerCamera();
  saveToStorage();
  render();
}

function updateGridSize() {
  document.getElementById('grid-size').textContent = `${GRID_COLS}x${GRID_ROWS}`;
}

// ─── Serialize / Deserialize ─────────────────────────────────────────
const STORAGE_KEY = 'kingmap-data';

function serialize() {
  return {
    gridCols: GRID_COLS,
    gridRows: GRID_ROWS,
    coordOffset,
    members: alliance.members.map(m => {
      const o = { name: m.name, col: m.plot.col, row: m.plot.row, building: m.building };
      if (m.level) o.level = m.level;
      return o;
    })
  };
}

function loadFromData(data) {
  GRID_COLS = data.gridCols || 24;
  GRID_ROWS = data.gridRows || 24;
  coordOffset.col = data.coordOffset?.col || 0;
  coordOffset.row = data.coordOffset?.row || 0;
  alliance.members.length = 0;
  grid = Array.from({ length: GRID_ROWS }, () => Array(GRID_COLS).fill(null));
  (data.members || []).forEach(m => {
    const member = { name: m.name, plot: { col: m.col, row: m.row }, building: m.building };
    // Older saves used T1-T9; convert them to TG1-TG9
    if (m.level) member.level = /^T\d+$/.test(String(m.level)) ? 'TG' + String(m.level).slice(1) : m.level;
    if (canPlace(m.col, m.row, BUILDING_TYPES[m.building].size)) {
      placeOnGrid(member);
      alliance.members.push(member);
    }
  });
}

function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize())); } catch(e) {}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { loadFromData(JSON.parse(raw)); return true; }
  } catch(e) {}
  return false;
}

// ─── Import / Export ─────────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kingshot-alliance.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.members || !Array.isArray(data.members)) {
        alert('Invalid file: missing members array.');
        return;
      }
      loadFromData(data);
      selectedTile = null;
      closeInfoPanel();
      closeAddPanel();
      updateMemberCount();
      updateGridSize();
      centerCamera();
      saveToStorage();
      render();
    } catch (err) {
      alert('Failed to import: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ─── Init ────────────────────────────────────────────────────────────
loadFromStorage();
document.getElementById('member-count').textContent = `${alliance.members.length} Members`;
updateGridSize();
buildLegend();
centerCamera();
render();
</script>
</body>
</html>
